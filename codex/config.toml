model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
personality = "pragmatic"
approval_policy = "on-request"
default_permissions = "workspace-customized"
web_search = "live"

approvals_reviewer = "guardian_subagent"

[permissions.workspace-customized]
extends = ":workspace"

[permissions.workspace-customized.filesystem]
"~/.cache/uv" = "write"
"~/Projects/agentrc/.git" = "write"
"~/Projects/chatall/.git" = "write"
"~/Projects/clawbot/.git" = "write"
"~/Projects/newtab/.git" = "write"
"~/Projects/Portseer/.git" = "write"
"~/Projects/pyCEvNS/.git" = "write"
"~/Projects/shusweb/.git" = "write"
"~/Projects/wechabo/.git" = "write"

[permissions.workspace-customized.filesystem.":workspace_roots"]
".git" = "write"

[permissions.workspace-customized.network]
enabled = true

[plugins."gmail@openai-curated"]
enabled = true

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."google-drive@openai-curated"]
enabled = true

[plugins."superpowers@openai-curated"]
enabled = false

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[features]
memories = true
terminal_resize_reflow = true
js_repl = false

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-used"]

[desktop]
mac-menu-bar-enabled = false
