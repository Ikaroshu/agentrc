# MesloLGS NF 12 with One Dark Pro pane colors and a blinking white block cursor.
font-family = MesloLGS NF
font-size = 12
cursor-style = block
cursor-style-blink = true

background = #282c34
foreground = #abb2bf
cursor-color = #ffffff
cursor-text = #282c34
selection-background = #41454e
selection-foreground = #abb2bf
palette = 0=#3f4451
palette = 1=#e05561
palette = 2=#8cc265
palette = 3=#d18f52
palette = 4=#4aa5f0
palette = 5=#c162de
palette = 6=#42b3c2
palette = 7=#d7dae0
palette = 8=#4f5666
palette = 9=#ff616e
palette = 10=#a5e075
palette = 11=#f0a45d
palette = 12=#4dc4ff
palette = 13=#de73ff
palette = 14=#4cd1e0
palette = 15=#e6e6e6

# Keep the block cursor at shell prompts, where shell integration would switch to a bar.
# Install Ghostty's terminfo on SSH hosts such as mini, falling back to xterm-256color.
shell-integration-features = no-cursor,ssh-terminfo,ssh-env
